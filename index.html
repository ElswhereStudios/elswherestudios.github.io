<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elswhere Studios</title>
<style>
  :root { --paper:#FBFBF8; --ink:#1B1D21; --muted:#6C727B; --accent:#2B6BF3; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#141518; --ink:#EDEEF0; --muted:#9AA1AB; --accent:#6E9BFF; }
  }
  body {
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  main { padding:2rem; max-width:32rem; }
  h1 { font-size:1.6rem; letter-spacing:-.02em; margin:0 0 .25rem; }
  p { color:var(--muted); margin:0 0 1.75rem; }
  ul { list-style:none; padding:0; margin:0; }
  li { margin:.5rem 0; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Elswhere Studios</h1>
  <p>Storyline Storyboarding for iPhone and iPad.</p>
  <ul>
    <li><a href="/storyline/support.html">Storyline &mdash; Support</a></li>
    <li><a href="/storyline/privacy.html">Storyline &mdash; Privacy Policy</a></li>
  </ul>
</main>
</body>
</html>
